site_name: macro_candi
site_description: >-
  Quantitative analysis of live 3D lattice light-sheet timelapses of
  Candida–macrophage host–pathogen interaction.
site_author: Jurgen Kriel
site_url: https://jurgenkriel.github.io/macro_candi/
repo_url: https://github.com/JurgenKriel/macro_candi
repo_name: JurgenKriel/macro_candi
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jurgen Kriel · GPL-3.0

theme:
  name: material
  language: en
  icon:
    logo: material/microscope
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

exclude_docs: |
  requirements.txt

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Your first run: getting-started/first-run.md
  - How it works:
      - concepts/index.md
      - Design principles: concepts/design.md
      - Glossary: concepts/glossary.md
  - Pipeline:
      - pipeline/index.md
      - 1 · Conversion: pipeline/01-conversion.md
      - 2 · Dataset manifest: pipeline/02-manifest.md
      - 3 · Calibration & bleaching: pipeline/03-calibration.md
      - 4 · Cropping: pipeline/04-cropping.md
      - 5 · 3D segmentation: pipeline/05-segmentation.md
      - 6 · Engulfment: pipeline/06-engulfment.md
      - 7 · Hyphal growth: pipeline/07-hyphae.md
  - Review & QC: review.md
  - Reference:
      - Outputs: reference/outputs.md
      - Command line: reference/cli.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - Known limitations: help/limitations.md
  - About:
      - Contributing: about/contributing.md
      - Citing & license: about/citing.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JurgenKriel/macro_candi
